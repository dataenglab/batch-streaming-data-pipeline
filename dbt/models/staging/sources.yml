version: 2

sources:
  - name: raw
    description: "Сырые данные, которые пишет scripts/generate_raw_data.py (DAG raw_to_mart_pipeline)"
    schema: public
    tables:
      - name: raw_orders
        description: "Грязные заказы: дубликаты order_id, пустые amount, даты в трёх форматах, всё текстом"
        columns:
          - name: order_id
            tests:
              - not_null
